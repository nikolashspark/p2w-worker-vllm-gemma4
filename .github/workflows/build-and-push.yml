name: build-and-push
on:
  push:
    branches: [main]
  workflow_dispatch: # Дозволяє запускати збірку вручну кнопкою в GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short git commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          # Додаємо два теги: фіксований SHA та рухомий latest
          tags: |
            ghcr.io/${{ github.repository_owner }}/worker-vllm-gemma4:${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository_owner }}/worker-vllm-gemma4:latest
          # КЕШУВАННЯ: Значно прискорює наступні збірки
          cache-from: type=gha
          cache-to: type=gha,mode=max
